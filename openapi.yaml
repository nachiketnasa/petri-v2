openapi: 3.0.3
info:
  title: Petri v2 API
  description: >-
    MVP slice: health check, email/password auth, experiment
    create/list/get/archive, and check-in create. OAuth, 2FA, goals,
    evolve/branch, other-tasks, and sharing endpoints are deferred to their
    own issues and are intentionally not in this contract.
  version: 0.1.0

servers:
  - url: /

security:
  - sessionCookie: []

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      security: []
      tags: [health]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /auth/signup:
    post:
      summary: Create a new account
      operationId: signup
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Log in with email and password
      operationId: login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Correct credentials, but the account's email isn't verified yet (#23).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: Correct credentials, but this account has 2FA enabled and no totp_code was supplied (#3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: Log out the current session
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      summary: Get the signed-in user
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me:
    patch:
      summary: Update the signed-in user's Settings preferences
      operationId: updateMyPreferences
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      summary: Request a password reset
      operationId: forgotPassword
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset flow initiated (always returned, regardless of whether the email exists).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/reset-password:
    post:
      summary: Reset password using a reset token
      operationId: resetPassword
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing or invalid field, or invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify-email:
    post:
      summary: Confirm a sign-up email verification code
      operationId: verifyEmail
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing field, or invalid/expired/already-used code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/resend-verification:
    post:
      summary: Send a fresh sign-up email verification code
      operationId: resendVerification
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: >-
            Always returned, regardless of whether the email exists or is
            already verified (same no-enumeration rule as forgot-password).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/2fa/enroll:
    post:
      summary: Start TOTP 2FA enrollment (does not enable it yet)
      operationId: enroll2fa
      tags: [auth]
      responses:
        "200":
          description: >-
            A pending secret -- shown once as text, plus an otpauth:// URI
            for the frontend to render as a QR code. 2FA isn't enabled
            until POST /auth/2fa/confirm verifies a real code against it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enroll2FAResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/2fa/confirm:
    post:
      summary: Confirm enrollment with one real code, enabling 2FA
      operationId: confirm2fa
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirm2FARequest"
      responses:
        "200":
          description: >-
            2FA enabled. The recovery codes are plaintext and shown exactly
            once here -- only their hashes are stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Confirm2FAResponse"
        "400":
          description: No pending enrollment, or an invalid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/2fa/disable:
    post:
      summary: Disable 2FA and delete its recovery codes
      operationId: disable2fa
      tags: [auth]
      responses:
        "204":
          description: 2FA disabled.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /experiments:
    post:
      summary: Create an experiment
      operationId: createExperiment
      tags: [experiments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
      responses:
        "201":
          description: Experiment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List experiments for the current user
      operationId: listExperiments
      tags: [experiments]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of experiments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /experiments/{id}:
    get:
      summary: Get a single experiment
      operationId: getExperiment
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /experiments/{id}/archive:
    post:
      summary: Archive an experiment (with retro, or an early-abandon reason)
      operationId: archiveExperiment
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveExperimentRequest"
      responses:
        "200":
          description: Experiment archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: >-
            Neither a complete retro (what_worked, what_didnt, decision) nor
            an abandon_reason was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /experiments/{id}/activate:
    post:
      summary: Activate a backlog experiment
      operationId: activateExperiment
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: >-
            Experiment is not in backlog status, or the user already has 2
            active experiments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /experiments/{id}/check-ins:
    post:
      summary: Record a check-in for an experiment
      operationId: createCheckIn
      tags: [check-ins]
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInRequest"
      responses:
        "201":
          description: Check-in recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      summary: List an experiment's check-in history, newest first
      operationId: listCheckIns
      tags: [check-ins]
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Check-in history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /goals:
    post:
      summary: Create a goal with its locked, ordered milestone list
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Goal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Missing/invalid field, or zero milestones supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List goals for the current user
      operationId: listGoals
      tags: [goals]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of goals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /goals/{id}:
    get:
      summary: Get a single goal, with its milestones
      operationId: getGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Goal found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Goal not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /goals/{id}/activate:
    post:
      summary: Activate a backlog goal (also activates its first milestone)
      operationId: activateGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Goal activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Goal is not in backlog status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Goal not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /goals/{id}/archive:
    post:
      summary: Archive a goal (with retro, or an early-abandon reason)
      operationId: archiveGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveExperimentRequest"
      responses:
        "200":
          description: Goal archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: >-
            Neither a complete retro nor an abandon_reason was supplied, or
            the goal isn't active/reflect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Goal not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /milestones/{id}/check-ins:
    post:
      summary: Record a check-in against a goal's currently active milestone
      operationId: createMilestoneCheckIn
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInRequest"
      responses:
        "201":
          description: Check-in recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "400":
          description: Missing/invalid field, or milestone is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Milestone not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List a milestone's check-in history, newest first
      operationId: listMilestoneCheckIns
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      responses:
        "200":
          description: Check-in history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Milestone not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /milestones/{id}/archive:
    post:
      summary: >-
        Archive the current milestone (with retro, or an early-abandon
        reason). Activates the next milestone in order, or moves the goal to
        reflect if this was the last one.
      operationId: archiveMilestone
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveExperimentRequest"
      responses:
        "200":
          description: Milestone archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "400":
          description: >-
            Neither a complete retro nor an abandon_reason was supplied, or
            the milestone isn't active/reflect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Milestone not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /other-tasks:
    post:
      summary: Create an Other task (#8, off by default via users.other_tasks_enabled)
      operationId: createOtherTask
      tags: [other-tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOtherTaskRequest"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherTask"
        "400":
          description: Missing/invalid field for the chosen schedule_type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List Other tasks for the current user
      operationId: listOtherTasks
      tags: [other-tasks]
      responses:
        "200":
          description: List of tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OtherTask"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /other-tasks/{id}:
    get:
      summary: Get a single Other task
      operationId: getOtherTask
      tags: [other-tasks]
      parameters:
        - $ref: "#/components/parameters/OtherTaskId"
      responses:
        "200":
          description: Task found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherTask"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Edit an Other task (editable at any time, per #8)
      operationId: updateOtherTask
      tags: [other-tasks]
      parameters:
        - $ref: "#/components/parameters/OtherTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOtherTaskRequest"
      responses:
        "200":
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherTask"
        "400":
          description: The merged (existing + patched) schedule is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove an Other task (removable at any time, per #8)
      operationId: deleteOtherTask
      tags: [other-tasks]
      parameters:
        - $ref: "#/components/parameters/OtherTaskId"
      responses:
        "204":
          description: Task deleted.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /daily-load:
    get:
      summary: >-
        The combined count of what's due on a given day (Other tasks +
        experiment check-ins + active milestone cadences) and whether it
        flags the day (#8, informational only, never blocks anything).
      operationId: getDailyLoad
      tags: [other-tasks]
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Defaults to today.
      responses:
        "200":
          description: Daily load.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLoad"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /push/vapid-public-key:
    get:
      summary: The server's VAPID public key, for PushManager.subscribe
      operationId: getVapidPublicKey
      tags: [other-tasks]
      security: []
      responses:
        "200":
          description: VAPID public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string

  /push/subscribe:
    post:
      summary: Register a Web Push subscription for the current user
      operationId: subscribeToPush
      tags: [other-tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "201":
          description: Subscribed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /push/unsubscribe:
    post:
      summary: Remove a Web Push subscription
      operationId: unsubscribeFromPush
      tags: [other-tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "204":
          description: Unsubscribed.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /experiments/{id}/share:
    post:
      summary: Share an experiment (idempotent; returns the existing token if already shared)
      operationId: shareExperiment
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/ExperimentId" }]
      responses:
        "200": { description: Share token., content: { application/json: { schema: { $ref: "#/components/schemas/ShareOut" } } } }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Experiment not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Unshare an experiment (deletes its likes/comments, invalidates the token)
      operationId: unshareExperiment
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/ExperimentId" }]
      responses:
        "204": { description: Unshared. }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Experiment not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /goals/{id}/share:
    post:
      summary: Share a goal (idempotent; returns the existing token if already shared)
      operationId: shareGoal
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/GoalId" }]
      responses:
        "200": { description: Share token., content: { application/json: { schema: { $ref: "#/components/schemas/ShareOut" } } } }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Goal not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Unshare a goal (deletes its likes/comments, invalidates the token)
      operationId: unshareGoal
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/GoalId" }]
      responses:
        "204": { description: Unshared. }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Goal not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /shared/{token}:
    get:
      summary: View a shared page -- no login required
      operationId: getSharedPage
      tags: [sharing]
      security: []
      parameters: [{ $ref: "#/components/parameters/ShareToken" }]
      responses:
        "200": { description: Shared page., content: { application/json: { schema: { $ref: "#/components/schemas/SharedPage" } } } }
        "404": { description: Shared page not found (never shared, or unshared since)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /shared/{token}/comments:
    post:
      summary: Comment on a shared page (requires sign-in)
      operationId: addSharedComment
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/ShareToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCommentRequest" } } }
      responses:
        "201": { description: Comment posted., content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Shared page not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /shared/{token}/comments/{comment_id}:
    delete:
      summary: Delete a comment (its author, or the shared item's owner, only)
      operationId: deleteSharedComment
      tags: [sharing]
      parameters:
        - { $ref: "#/components/parameters/ShareToken" }
        - { name: comment_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Comment deleted. }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not the comment's author or the page's owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Shared page or comment not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /shared/{token}/like:
    post:
      summary: Like a shared page (requires sign-in)
      operationId: likeSharedPage
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/ShareToken" }]
      responses:
        "204": { description: Liked. }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Shared page not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Unlike a shared page
      operationId: unlikeSharedPage
      tags: [sharing]
      parameters: [{ $ref: "#/components/parameters/ShareToken" }]
      responses:
        "204": { description: Unliked. }
        "401": { description: Not authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Shared page not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  parameters:
    ExperimentId:
      name: id
      in: path
      required: true
      schema:
        type: string

    GoalId:
      name: id
      in: path
      required: true
      schema:
        type: string

    MilestoneId:
      name: id
      in: path
      required: true
      schema:
        type: string

    OtherTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string

    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    User:
      type: object
      description: >-
        Mirrors repository.py's User dataclass, minus password_hash, which is
        server-internal and never returned.
      required:
        [
          id,
          email,
          display_name,
          timezone,
          created_at,
          theme,
          sound_effects_enabled,
          other_tasks_enabled,
          default_landing,
          email_verified,
          totp_enabled,
        ]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        theme:
          type: string
          enum: [petri-light, petri-dark, solarized-light, solarized-dark]
        sound_effects_enabled:
          type: boolean
        other_tasks_enabled:
          type: boolean
          description: Off by default (#8); turned on from Settings.
        default_landing:
          type: string
          enum: [greeting, dashboard]
        email_verified:
          type: boolean
          description: True once POST /auth/verify-email has confirmed the sign-up code (#23).
        totp_enabled:
          type: boolean
          description: True once POST /auth/2fa/confirm has enabled two-factor auth (#3).

    Enroll2FAResponse:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret, shown once as text for apps that can't scan a QR.
        otpauth_uri:
          type: string
          description: otpauth:// URI for the frontend to render as a QR code.

    Confirm2FARequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    Confirm2FAResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: Plaintext, shown exactly once; only their hashes are stored.

    UpdateUserPreferencesRequest:
      type: object
      description: All fields optional; only the ones provided are updated.
      properties:
        theme:
          type: string
          enum: [petri-light, petri-dark, solarized-light, solarized-dark]
        sound_effects_enabled:
          type: boolean
        other_tasks_enabled:
          type: boolean
        default_landing:
          type: string
          enum: [greeting, dashboard]

    SignupRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        display_name:
          type: string
        timezone:
          type: string
          default: UTC

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        totp_code:
          type: string
          description: >-
            Required once the account has 2FA enabled (#3): a 6-digit TOTP
            code, or a recovery code. Omitting it on a 2FA account returns
            428, not 401.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password

    VerifyEmailRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The 6-digit code emailed at sign-up.

    Goal:
      type: object
      description: Mirrors repository.py's Goal dataclass, with its milestones embedded.
      required:
        - id
        - user_id
        - title
        - why_text
        - start_date
        - target_date
        - status
        - ended_early
        - abandon_reason
        - evolved_from_experiment_id
        - branched_into_goal_id
        - branched_from_goal_id
        - created_at
        - updated_at
        - archived_at
        - milestones
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        why_text:
          type: string
        start_date:
          type: string
          format: date
        target_date:
          type: string
          format: date
        status:
          type: string
          enum: [backlog, active, reflect, archived]
        ended_early:
          type: boolean
        abandon_reason:
          type: string
          nullable: true
        evolved_from_experiment_id:
          type: string
          nullable: true
        branched_into_goal_id:
          type: string
          nullable: true
        branched_from_goal_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"

    Milestone:
      type: object
      description: >-
        Mirrors repository.py's Milestone dataclass. Runs exactly like an
        experiment (own cadence, own check-ins) under a different label; no
        start_date/target_days of its own, unlike Experiment.
      required:
        - id
        - goal_id
        - order_index
        - title
        - cadence_type
        - cadence_days
        - check_in_kind
        - target_date
        - status
        - ended_early
        - abandon_reason
        - created_at
        - updated_at
        - archived_at
      properties:
        id:
          type: string
        goal_id:
          type: string
        order_index:
          type: integer
        title:
          type: string
        cadence_type:
          type: string
          enum: [daily, weekly, custom]
        cadence_days:
          type: integer
          nullable: true
        check_in_kind:
          type: string
          enum: [boolean, rating]
        target_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [backlog, active, reflect, archived]
        ended_early:
          type: boolean
        abandon_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true

    MilestoneSpec:
      type: object
      description: One entry in CreateGoalRequest.milestones, locked at creation.
      required: [title, cadence_type]
      properties:
        title:
          type: string
        cadence_type:
          type: string
          enum: [daily, weekly, custom]
        cadence_days:
          type: integer
          description: Required when cadence_type is 'custom'.
        check_in_kind:
          type: string
          enum: [boolean, rating]
          description: Defaults to 'boolean' if omitted.
        target_date:
          type: string
          format: date

    CreateGoalRequest:
      type: object
      required: [title, why_text, start_date, target_date, milestones]
      properties:
        title:
          type: string
        why_text:
          type: string
        start_date:
          type: string
          format: date
        target_date:
          type: string
          format: date
        milestones:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MilestoneSpec"

    OtherTask:
      type: object
      description: Mirrors repository.py's OtherTask dataclass.
      required:
        [
          id,
          user_id,
          title,
          schedule_type,
          one_time_date,
          repeat_days_of_week,
          repeat_interval_days,
          repeat_end_date,
          push_reminder_enabled,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        schedule_type:
          type: string
          enum: [one_time, repeating]
        one_time_date:
          type: string
          format: date
          nullable: true
        repeat_days_of_week:
          type: array
          items:
            type: integer
          nullable: true
          description: 0=Mon .. 6=Sun.
        repeat_interval_days:
          type: integer
          nullable: true
        repeat_end_date:
          type: string
          format: date
          nullable: true
        push_reminder_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOtherTaskRequest:
      type: object
      required: [title, schedule_type]
      properties:
        title:
          type: string
        schedule_type:
          type: string
          enum: [one_time, repeating]
        one_time_date:
          type: string
          format: date
          description: Required when schedule_type is 'one_time'.
        repeat_days_of_week:
          type: array
          items:
            type: integer
          description: 0=Mon .. 6=Sun. Provide this or repeat_interval_days when repeating.
        repeat_interval_days:
          type: integer
        repeat_end_date:
          type: string
          format: date
          description: Required when schedule_type is 'repeating'.
        push_reminder_enabled:
          type: boolean
          default: true

    UpdateOtherTaskRequest:
      type: object
      description: All fields optional; only the ones provided are updated.
      properties:
        title:
          type: string
        schedule_type:
          type: string
          enum: [one_time, repeating]
        one_time_date:
          type: string
          format: date
        repeat_days_of_week:
          type: array
          items:
            type: integer
        repeat_interval_days:
          type: integer
        repeat_end_date:
          type: string
          format: date
        push_reminder_enabled:
          type: boolean

    DailyLoad:
      type: object
      required: [date, count, over_threshold, breakdown]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
        over_threshold:
          type: boolean
          description: True once count exceeds 8 (specs.md -> "Other tasks"). Informational only.
        breakdown:
          type: object
          properties:
            other_tasks:
              type: integer
            experiment_check_ins:
              type: integer
            milestone_check_ins:
              type: integer

    PushSubscribeRequest:
      type: object
      required: [endpoint, p256dh_key, auth_key]
      properties:
        endpoint:
          type: string
        p256dh_key:
          type: string
        auth_key:
          type: string

    PushUnsubscribeRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string

    ShareOut:
      type: object
      required: [token]
      properties:
        token: { type: string }

    Comment:
      type: object
      required: [id, user_id, display_name, body, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        display_name: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }

    SharedPage:
      type: object
      description: >-
        Never notes or retro content (specs.md's Sharing model) -- only
        title/hypothesis/cadence/status/streak (experiment) or
        title/milestone-progress (goal).
      required: [kind, title, status, like_count, viewer_has_liked, comments]
      properties:
        kind: { type: string, enum: [experiment, goal] }
        title: { type: string }
        hypothesis: { type: string, nullable: true }
        cadence_type: { type: string, nullable: true }
        status: { type: string }
        streak: { type: integer, nullable: true }
        milestone_index: { type: integer, nullable: true, description: 1-based, current active milestone. }
        milestone_count: { type: integer, nullable: true }
        like_count: { type: integer }
        viewer_has_liked: { type: boolean }
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }

    Experiment:
      type: object
      description: Mirrors repository.py's Experiment dataclass.
      required:
        - id
        - user_id
        - title
        - hypothesis
        - cadence_type
        - cadence_days
        - check_in_kind
        - start_date
        - target_days
        - status
        - ended_early
        - abandon_reason
        - created_at
        - updated_at
        - archived_at
        - check_in_due
        - streak
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        hypothesis:
          type: string
        cadence_type:
          type: string
        cadence_days:
          type: integer
          nullable: true
        check_in_kind:
          type: string
        start_date:
          type: string
          format: date
        target_days:
          type: integer
        status:
          type: string
        ended_early:
          type: boolean
        abandon_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
        check_in_due:
          type: boolean
          description: >-
            Derived, not persisted: cadence elapsed since the last check-in
            (or since start_date, if none yet), only ever true while status
            is "active".
        streak:
          type: integer
          description: >-
            Derived, not persisted: consecutive fully-elapsed cadence
            periods with at least one check-in each, counting back from the
            most recently elapsed period; a missed period resets it to 0.
            Computed in the signed-in user's own timezone.

    CreateExperimentRequest:
      type: object
      required: [title, hypothesis, cadence_type, target_days]
      properties:
        title:
          type: string
        hypothesis:
          type: string
        cadence_type:
          type: string
        cadence_days:
          type: integer
          nullable: true
        check_in_kind:
          type: string
        start_date:
          type: string
          format: date
        target_days:
          type: integer

    ArchiveExperimentRequest:
      type: object
      description: >-
        Either a complete retro (what_worked, what_didnt, decision) or an
        abandon_reason must be supplied; there is no standalone retro
        endpoint in this slice, so retro data travels on this call.
      properties:
        what_worked:
          type: string
        what_didnt:
          type: string
        decision:
          type: string
        abandon_reason:
          type: string

    CheckIn:
      type: object
      description: >-
        Mirrors repository.py's CheckIn dataclass. Belongs to exactly one of
        an experiment or a milestone -- exactly one of experiment_id/
        milestone_id is non-null.
      required:
        - id
        - experiment_id
        - milestone_id
        - value_bool
        - value_rating
        - note
        - checked_in_at
      properties:
        id:
          type: string
        experiment_id:
          type: string
          nullable: true
        milestone_id:
          type: string
          nullable: true
        value_bool:
          type: boolean
          nullable: true
        value_rating:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        checked_in_at:
          type: string
          format: date-time

    CreateCheckInRequest:
      type: object
      properties:
        value_bool:
          type: boolean
          nullable: true
        value_rating:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        checked_in_at:
          type: string
          format: date-time
