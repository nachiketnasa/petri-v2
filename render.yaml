# Render Blueprint for both Petri environments: dev and production.
#
# Two services each on Render: the backend (Docker web service) and the
# frontend (static site). Four resources in one blueprint — Render syncs one
# blueprint per blueprint instance, so a second file would need a second repo
# connection and nothing in the repo would say which is authoritative. Dev
# block first, prod block second; see README.md's Environments table for which
# deploy trigger owns which.
#
# The databases are NOT on Render. Render's free tier allows one free Postgres
# per account (a real sync failed on the second one) and expires it after 30
# days. Each environment instead gets its own Neon project (petri-dev,
# petri-prod) on Neon's free plan: separate databases, no expiry. DATABASE_URL
# is therefore `sync: false` on both backends — you paste each Neon
# connection string into the Render Dashboard; it never lives in this repo.
#
# Auto-deploy is OFF on both services on purpose. Render's own
# deploy-on-push would fire on the merge commit the instant it lands, in
# parallel with the test run, and could ship code whose suites have not passed
# on the merge result. The `deploy` job in .github/workflows/ci.yml owns the
# trigger instead: it runs with `needs: [backend, frontend]` and POSTs a Render
# deploy hook per service, so a red suite means no deploy.
#
# `autoDeployTrigger: "off"` is the current spelling; `autoDeploy` is
# deprecated AND Render's blueprint validator now rejects a file that sets
# both ("autoDeploy and autoDeployTrigger cannot both be set"), so only
# `autoDeployTrigger` appears below. "off" is quoted because YAML would
# otherwise parse the bare word as the boolean false.
#
# One-time manual step after the first sync: apply _docs/schema.sql to the
# database. It is NOT idempotent (`create table users (` with no
# `if not exists`), so it must never go in a build or deploy command. See
# README.md's "Deploying to Render (dev)" section.

services:
  - type: web
    name: petri-backend-dev
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # The Neon petri-dev project's direct (non-pooled) connection string (it carries
      # ?sslmode=require). Entered in the Render Dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # The sibling static site's public URL. Feeds CORSMiddleware's
      # allow_origins and the 500-handler's headers; left unset every browser
      # call from the deployed frontend is CORS-blocked. `fromService` cannot
      # produce this: `property: host` is a bare hostname and render.yaml has
      # no way to prepend "https://".
      - key: FRONTEND_ORIGIN
        value: https://petri-frontend-dev-e9be.onrender.com
      # Real secrets: declared here, values entered in the Render Dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false

  - type: web
    name: petri-frontend-dev
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist  # relative to rootDir, per Render's monorepo docs
    autoDeployTrigger: "off"
    # App.tsx uses BrowserRouter with real paths (/sign-in, /reset-password,
    # ...). Without this rewrite every deep link and every reload off / hits
    # Render's 404 page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The sibling backend service's public URL. Vite inlines
      # import.meta.env.VITE_BACKEND_URL at BUILD time, so this belongs on the
      # static site, not the backend, and changing it needs a rebuild.
      - key: VITE_BACKEND_URL
        value: https://petri-backend-dev-vq9g.onrender.com
      # Render picks its own default Node otherwise; pin the project's Node 24.
      - key: NODE_VERSION
        value: "24"

  # ---------------------------------------------------------------------------
  # Production. Same two services, prod names, cross-wired to each other, with
  # their own Neon database (petri-prod) — nothing is shared with dev.
  #
  # Deploys are manual only: .github/workflows/deploy-prod.yml is
  # `workflow_dispatch`-only, needs a typed confirmation, refuses any ref but
  # main, and waits on a required reviewer on the `production` GitHub
  # environment. `autoDeployTrigger: "off"` is what makes that true on
  # Render's side too — a prod service left on deploy-on-push would ship
  # every merge regardless of what the workflow says.
  # ---------------------------------------------------------------------------

  - type: web
    name: petri-backend-prod
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # The Neon petri-prod project's direct (non-pooled) connection string (it carries
      # ?sslmode=require). Entered in the Render Dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # The sibling static site's public URL. Feeds CORSMiddleware's
      # allow_origins and the 500-handler's headers; left unset every browser
      # call from the deployed frontend is CORS-blocked. `fromService` cannot
      # produce this: `property: host` is a bare hostname and render.yaml has
      # no way to prepend "https://".
      - key: FRONTEND_ORIGIN
        value: https://petri-frontend-prod-iin7.onrender.com
      # Real secrets: declared here, values entered in the Render Dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false

  - type: web
    name: petri-frontend-prod
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist  # relative to rootDir, per Render's monorepo docs
    autoDeployTrigger: "off"
    # Not inherited from the dev site. App.tsx uses BrowserRouter with real
    # paths (/sign-in, /reset-password, ...); without this rewrite every prod
    # deep link and every reload off / hits Render's 404 page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The sibling backend service's public URL. Vite inlines
      # import.meta.env.VITE_BACKEND_URL at BUILD time, so this belongs on the
      # static site, not the backend, and changing it needs a rebuild.
      # `fromService` cannot produce it (see FRONTEND_ORIGIN above).
      - key: VITE_BACKEND_URL
        value: https://petri-backend-prod-h3fe.onrender.com
      # Render picks its own default Node otherwise; pin the project's Node 24.
      - key: NODE_VERSION
        value: "24"
