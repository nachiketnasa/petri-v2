name: CI

# PR merge gate only: runs both test suites, deploys nothing, reads no secrets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petri
          POSTGRES_PASSWORD: petri
          POSTGRES_DB: petri
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petri -d petri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Service containers get no /docker-entrypoint-initdb.d volume, so load the
      # schema by hand. psql ships with the runner image.
      - name: Apply schema
        env:
          PGPASSWORD: petri
        run: psql -h localhost -U petri -d petri -v ON_ERROR_STOP=1 -f _docs/schema.sql
      - name: pytest
        working-directory: backend
        env:
          # Without this the Postgres integration tests skipif-skip silently.
          DATABASE_URL: postgresql://petri:petri@localhost:5432/petri
        run: uv run --frozen pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # README pins Node 24 LTS; frontend/Dockerfile still says node:22-slim — mismatch noted, not fixed here.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: vitest
        working-directory: frontend
        run: npm test
